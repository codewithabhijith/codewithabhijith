<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="30" viewBox="0 0 1000 30" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#7B2FFF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7B2FFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="30" fill="#050816"/>
  <rect x="40" y="14.5" width="920" height="1.5" fill="url(#line)"/>
  <circle cy="15" r="4" fill="#00F0FF" filter="url(#g)">
    <animate attributeName="cx" values="40;960;40" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00F0FF;#7B2FFF;#00F0FF" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g transform="translate(500 15)" fill="none" stroke="#00F0FF" stroke-width="1.5">
    <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
