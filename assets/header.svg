<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Abhijith V S - Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050E"/>
      <stop offset="0.55" stop-color="#07112B"/>
      <stop offset="1" stop-color="#16072F"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#7B2FFF;#00F0FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#7B2FFF">
        <animate attributeName="stop-color" values="#7B2FFF;#00F0FF;#7B2FFF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.09" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="reveal">
      <rect y="195" height="40" x="500" width="0">
        <animate attributeName="x" values="500;110;110;500" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="width" values="0;780;780;0" keyTimes="0;0.35;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>

  <circle cx="130" cy="150" r="120" fill="#00F0FF" opacity="0.05">
    <animate attributeName="opacity" values="0.03;0.10;0.03" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="150" r="120" fill="#7B2FFF" opacity="0.07">
    <animate attributeName="opacity" values="0.10;0.03;0.10" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g fill="none">
    <circle cx="130" cy="150" r="64" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 130 150" to="360 130 150" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="150" r="44" stroke="#7B2FFF" stroke-width="2" stroke-dasharray="22 9" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="360 130 150" to="0 130 150" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="150" r="24" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="0 130 150" to="360 130 150" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="150" r="64" stroke="#7B2FFF" stroke-width="1.5" stroke-dasharray="6 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="360 870 150" to="0 870 150" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="150" r="44" stroke="#00F0FF" stroke-width="2" stroke-dasharray="22 9" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0 870 150" to="360 870 150" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="150" r="24" stroke="#7B2FFF" stroke-width="1" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="360 870 150" to="0 870 150" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="130" cy="150" r="6" fill="#00F0FF" filter="url(#glow)">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="150" r="6" fill="#7B2FFF" filter="url(#glow)">
    <animate attributeName="r" values="8;4;8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g fill="#00F0FF">
    <circle cx="250" cy="280" r="2"><animate attributeName="cy" values="290;10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="290" r="1.5"><animate attributeName="cy" values="290;10" dur="9s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="290" r="2"><animate attributeName="cy" values="290;10" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="290" r="1.5"><animate attributeName="cy" values="290;10" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="290" r="2"><animate attributeName="cy" values="290;10" dur="7.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" begin="3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="290" r="1.5"><animate attributeName="cy" values="290;10" dur="6.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="290" r="2"><animate attributeName="cy" values="290;10" dur="8.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8.5s" begin="2.5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#7B2FFF">
    <circle cx="290" cy="290" r="2"><animate attributeName="cy" values="290;10" dur="10s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="10s" begin="4s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="290" r="2"><animate attributeName="cy" values="290;10" dur="7s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7s" begin="5s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="290" r="2"><animate attributeName="cy" values="290;10" dur="9s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="9s" begin="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="0" y="0" width="1000" height="3" fill="url(#scan)">
    <animate attributeName="y" values="0;297;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g fill="none" stroke="#00F0FF" stroke-width="2">
    <path d="M20 56V20H56"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></path>
    <path d="M944 20H980V56"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="0.7s" repeatCount="indefinite"/></path>
    <path d="M20 244V280H56"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="1.4s" repeatCount="indefinite"/></path>
    <path d="M944 280H980V244"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" begin="2.1s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="'Courier New', Consolas, monospace" font-size="13" fill="#58A6FF">
    <text x="62" y="46" opacity="0.85">// DEV.PROFILE</text>
    <text x="938" y="46" text-anchor="end" opacity="0.85">BUILD &gt; TEST &gt; LEARN &gt; IMPROVE</text>
    <circle cx="68" cy="276" r="4" fill="#00FF9C"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="80" y="280" fill="#00FF9C">SYSTEM ONLINE</text>
    <text x="938" y="280" text-anchor="end">MOBILE // WEB // BACKEND</text>
  </g>

  <text x="500" y="160" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="7" fill="url(#name)" filter="url(#glow)">
    ABHIJITH V S
    <animate attributeName="opacity" values="1;1;0.82;1;1;0.9;1" keyTimes="0;0.5;0.52;0.54;0.8;0.82;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#reveal)">
    <text x="500" y="222" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="19" fill="#9FD8FF" letter-spacing="2">&gt; SOFTWARE ENGINEER  //  FLUTTER • JAVA • SPRING BOOT</text>
  </g>
</svg>
